title: FeverLink3
description: Play Transport Fever 3 together. Fully integrated into the game, no launcher.
theme: jekyll-theme-cayman
show_downloads: false
lang: en
# Not part of the public site (the files stay in the repository for developers):
# listing material for maintainers, internal research notes, design notes for transports that are not announced,
# and developer notes that are internal or out of date (release and signing checklists, the live-control file format,
# trace logs, coverage tables, the companies design, the Steam transport design, the publishing plan).
exclude:
  - nexus
  - research
  - RELAY.md
  - COMPANIES.md
  - COVERAGE_BUILD.md
  - COVERAGE_OPS.md
  - LIVE_CONTROL.md
  - RELEASING.md
  - SIGNING.md
  - STEAM_TRANSPORT.md
  - TRACE.md
  - WORKSHOP.md
