[workspace]
resolver = "2"
members = ["core", "native", "launcher", "tools/release"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
publish = false
authors = ["FeverLink3 contributors"]
repository = "https://github.com/AZalshehri7/FeverLink3"

# Shared by every crate. Tuned for the native DLL: smallest code, one codegen unit, stripped.
#
# panic = "unwind" is REQUIRED, not a size trade-off, since the crash of 2026-10-11 (docs/NATIVE_LINK.md, section 10):
# the hooks sit between the game and its own C++ functions, and those throw. With "abort" every Rust frame is a
# terminate pad for a foreign exception (even one declared extern "system-unwind"), so the first exception of the
# game that passed through a hook ended the process with "panic in a function that cannot unwind". With "unwind" the
# exception passes through our frames; the price is about 550 KB of DLL (MSVC, rustc 1.99: 1 132 544 -> 1 662 464
# bytes), docs/SECURITY.md section 5. It also lets launcher::guard and native::log::guarded contain a panic in our own
# bookkeeping. CI fails if the shipped DLL has a terminate pad on the hook path (tools/dll_unwind_check.py).
# Debug builds (the tests): the hash and cipher crates optimized. The sealed channel stretches a password with 600 000 rounds of
# PBKDF2-HMAC-SHA256, seconds per key unoptimized; tests derive many keys. Our own crates stay unoptimized (debug asserts, overflow
# checks). Release builds are not affected.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3
[profile.dev.package.ctr]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
# the JSON parser: the hostile-input tests feed it megabytes (a million nested arrays must be refused, not overflow the stack)
[profile.dev.package.serde_json]
opt-level = 3

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
debug = false
