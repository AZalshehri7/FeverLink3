[package]
name = "feverlink3_core"
description = "FeverLink3 protocol core: framing, sealed channel, join codes, session state machines. No game, UI or platform code."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
# Without default features: the crate's own `os_rng` would pull getrandom 0.4, whose raw-dylib import of
# bcryptprimitives needs an assembler the self-contained GNU toolchain does not ship.
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
hkdf = "0.13.0"
hmac = "0.13.0"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
sha2 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: a double parses back to exactly the value that was printed. The default parser can be one unit in
# the last place off, and the Authority values (money) the host sends travel as JSON doubles.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
base64 = "0.23.1"
# 0.2 links bcrypt through an ordinary import library, which both the GNU and the MSVC toolchains have.
getrandom = "0.2.16"

[dev-dependencies]
# Seeded generators for the randomised robustness tests; already in the workspace through the launcher.
rand = "0.8"
