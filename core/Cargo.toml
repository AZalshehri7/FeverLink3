[package]
name = "feverlink3_core"
description = "FeverLink3 protocol core: framing, sealed channel, join codes, session state machines. No game, UI or platform code."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
# Without default features: the crate's own `os_rng` would pull getrandom 0.4, whose raw-dylib import of
# bcryptprimitives needs an assembler the self-contained GNU toolchain does not ship.
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
hkdf = "0.13.0"
hmac = "0.13.0"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
sha2 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.23.1"
# 0.2 links bcrypt through an ordinary import library, which both the GNU and the MSVC toolchains have.
getrandom = "0.2.16"
