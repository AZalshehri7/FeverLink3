name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=core.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  native:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release
      - run: Get-Item target/release/feverlink3_native.dll | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: winhttp-dll
          path: native/target/release/feverlink3_native.dll
