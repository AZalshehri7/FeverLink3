name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --exclude feverlink3_native
      # the native tests share process-wide state (hook counters, logs): one thread at a time
      - run: cargo test -p feverlink3_native -- --test-threads=1
      - run: cargo build --release -p feverlink3_native
      - run: Get-Item target/release/feverlink3_native.dll | Select-Object Name, Length
      - name: The shipped DLL unwinds (the game's exceptions pass through the hooks)
        shell: pwsh
        run: |
          python -m pip install pefile capstone
          python tools/dll_unwind_check.py target/release/feverlink3_native.dll target/release/feverlink3_native.pdb --check
          python tools/dll_unwind_check.py target/release/feverlink3_native.dll target/release/feverlink3_native.pdb
      - name: DLL size in the job summary
        shell: pwsh
        run: |
          # The shipped DLL (panic = "unwind") and the same code with abort, in another target folder so the artifact
          # below is untouched. Abort is smaller and cannot be shipped: docs/NATIVE_LINK.md section 10.
          $unwind = (Get-Item target/release/feverlink3_native.dll).Length
          $env:CARGO_PROFILE_RELEASE_PANIC = 'abort'
          cargo build --release -p feverlink3_native --target-dir target/abort
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item Env:CARGO_PROFILE_RELEASE_PANIC
          $abort = (Get-Item target/abort/release/feverlink3_native.dll).Length
          $extra = $unwind - $abort
          @(
            '### feverlink3_native.dll (release, windows-latest)',
            '',
            '| panic | bytes | KiB |',
            '|---|---:|---:|',
            ('| unwind (shipped) | {0:N0} | {1:N1} |' -f $unwind, ($unwind / 1KB)),
            ('| abort (not shippable) | {0:N0} | {1:N1} |' -f $abort, ($abort / 1KB)),
            ('| cost of unwinding | {0:N0} (+{1:N1} %) | {2:N1} |' -f $extra, (100 * $extra / $abort), ($extra / 1KB))
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: winhttp-dll
          path: target/release/feverlink3_native.dll

  # RustSec advisories against Cargo.lock. The action is pinned to the commit of its v2.0.0 tag.
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  lua:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lupa
      - run: python -I -m unittest discover -s tests/lua -p "test_*.py"
