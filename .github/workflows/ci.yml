name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p feverlink3_native
      - run: Get-Item target/release/feverlink3_native.dll | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: winhttp-dll
          path: target/release/feverlink3_native.dll

  lua:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lupa
      - run: python -I tests/lua/test_lockstep.py
