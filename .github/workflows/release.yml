name: Release

# A release is built here, never on a developer's PC, and only from a commit on main whose message starts with the
# version, for example `V0.1.0: First beta release` (a dash in the version, `V0.2.0-beta.1: ...`, makes a pre-release).
# Every other commit only runs CI. See docs/RELEASING.md.
#
# Three jobs, so the signing key is reachable from as little as possible:
#   build   no secrets: build, package, wait for CI of the same commit (the tests run there); hands `dist/` on.
#   sign    the only job with the key. It runs in the GitHub environment `release-signing`, which the owner sets up
#           to require his approval and to accept main only; the key is a secret of that environment, not of the
#           repository. It signs manifest.json and checks the signature with the launcher's own trusted-key list.
#           SKIPPED until 1.0.0 (owner decision 2026-10-22): releases are published unsigned. The job runs only when
#           the repository variable RELEASE_SIGNING is `on`; set it together with the first key in TRUSTED_KEYS
#           (launcher/src/update.rs), and from then on a release without a signature fails (docs/RELEASING.md).
#   publish creates the GitHub release from the build's files and the signature (if any); it never sees the key.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: ${{ startsWith(github.event.head_commit.message, 'V') }}
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read   # the wait for CI of this commit
    outputs:
      release: ${{ steps.parse.outputs.release }}
      version: ${{ steps.parse.outputs.version }}
    env:
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - name: Read the version from the commit message
        id: parse
        shell: pwsh
        run: |
          # `V<major>.<minor>.<patch>[-suffix]: <title>` on the first line; anything else is not a release.
          $first = ($env:COMMIT_MESSAGE -split "`n")[0].Trim()
          if ($first -match '^V(\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?): \S') {
            "release=true" >> $env:GITHUB_OUTPUT
            "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
            Write-Host "release $($Matches[1])"
          } else {
            "release=false" >> $env:GITHUB_OUTPUT
            Write-Host "not a release commit: $first"
          }

      - if: steps.parse.outputs.release == 'true'
        uses: actions/checkout@v4
      - if: steps.parse.outputs.release == 'true'
        uses: dtolnay/rust-toolchain@stable

      # FEVERLINK3_OFFICIAL_BUILD marks the module as a release build: only those update themselves in the game
      # (launcher/src/autoupdate.rs). A module built on a developer's PC never replaces itself with GitHub's release.
      - if: steps.parse.outputs.release == 'true'
        env:
          FEVERLINK3_OFFICIAL_BUILD: '1'
        run: cargo build --release --workspace

      - name: Package
        if: steps.parse.outputs.release == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          $version = $env:VERSION
          cargo run --release -p feverlink3_release -- package --version $version --out dist
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The tests run once, in CI, for this same commit (owner 2026-10-23: the release job ran them a second time, ~5 min).
      # Nothing is handed on to publish until that CI run has passed.
      - name: Wait for CI of this commit to pass
        if: steps.parse.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $deadline = (Get-Date).AddMinutes(40)
          while ((Get-Date) -lt $deadline) {
            $run = gh run list --repo $env:GITHUB_REPOSITORY --workflow CI --commit $env:GITHUB_SHA --limit 1 --json status,conclusion | ConvertFrom-Json
            if ($run -and $run[0].status -eq 'completed') {
              if ($run[0].conclusion -eq 'success') { Write-Host 'CI passed'; exit 0 }
              Write-Host "CI of this commit ended: $($run[0].conclusion)"; exit 1
            }
            Start-Sleep 20
          }
          Write-Host 'CI of this commit did not finish within 40 minutes'; exit 1

      - if: steps.parse.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    if: ${{ needs.build.outputs.release == 'true' && vars.RELEASE_SIGNING == 'on' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: windows-latest
    # Protection rules (required reviewer, main only) live in the repository settings: docs/RELEASING.md.
    environment: release-signing
    outputs:
      signed: ${{ steps.check.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # built before the key is in reach; the signing step only runs the finished program
      - run: cargo build --release -p feverlink3_release

      - name: Sign manifest
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) {
            # RELEASE_SIGNING is on, so the updaters in the field expect a signature: no key is an error.
            Write-Error "RELEASE_SIGNING is on but RELEASE_SIGNING_KEY is not set in the release-signing environment"
            exit 1
          }
          # The key is written to the runner's temp folder, used once and deleted.
          $keyFile = Join-Path $env:RUNNER_TEMP 'feverlink3_release.key'
          Set-Content -NoNewline -Path $keyFile -Value $env:SIGNING_KEY
          try {
            ./target/release/feverlink3_release.exe sign --key $keyFile --manifest dist/manifest.json
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } finally {
            Remove-Item -Force $keyFile
          }

      - name: Check the signature as the launcher will
        id: check
        shell: pwsh
        run: |
          # The launcher's TRUSTED_KEYS, its expiry rule and the zip hash: a signature players would refuse stops here.
          if (Test-Path dist/manifest.json.sig) {
            ./target/release/feverlink3_release.exe verify --manifest dist/manifest.json
            if ($LASTEXITCODE -ne 0) { exit 1 }
            "signed=true" >> $env:GITHUB_OUTPUT
          } else {
            "signed=false" >> $env:GITHUB_OUTPUT
          }

      - if: steps.check.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signature
          path: dist/manifest.json.sig
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, sign]
    # runs when sign succeeded or was skipped (unsigned until 1.0.0), never after a failed or cancelled sign
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.release == 'true' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # an unsigned release has no signature artifact
      - if: needs.sign.outputs.signed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: signature
          path: dist

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SIGNING: ${{ vars.RELEASE_SIGNING }}
        run: |
          $version = $env:VERSION
          $zip = "FeverLink3-$version.zip"
          $sha = (Get-Content "dist/$zip.sha256").Split(' ')[0]
          if ((Get-FileHash "dist/$zip" -Algorithm SHA256).Hash.ToLower() -ne $sha) { Write-Error "zip hash changed between jobs"; exit 1 }
          $signed = Test-Path dist/manifest.json.sig
          # once signing is on (1.0.0), updaters require the signature: an unsigned release would reach nobody
          if (-not $signed -and "$env:SIGNING" -eq 'on') { Write-Error "RELEASE_SIGNING is on: the release must be signed"; exit 1 }
          $sigLine = if ($signed) { "The manifest is signed with Ed25519 (manifest.json.sig, checked against the launcher's trusted keys)." } else { "This release is NOT signed (unsigned until 1.0.0). The in-game updater checks the zip against manifest.json and the .sha256 file, and every file against manifest.json." }
          $log = Get-Content docs/CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## $([regex]::Escape($version))\b[^\n]*\r?\n(.*?)(?=^## |\z)")
          if (-not $m.Success) { $m = [regex]::Match($log, "(?ms)^## Unreleased[^\n]*\r?\n(.*?)(?=^## |\z)") }
          $changes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See docs/CHANGELOG.md." }
          $notes = @"
          FeverLink3 $version

          $changes

          SHA-256 of ${zip}:

          ``$sha``

          $sigLine Verify by hand: see docs/RELEASING.md.
          "@
          Set-Content -Path notes.md -Value $notes
          $assets = @("dist/$zip", "dist/$zip.sha256", "dist/manifest.json")
          if ($signed) { $assets += "dist/manifest.json.sig" }
          $extra = @(); if ("$version" -match '-') { $extra += '--prerelease' }
          gh release create "v$version" @assets --target "${{ github.sha }}" --title "FeverLink3 $version" --notes-file notes.md @extra
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # The same zip on Nexus Mods (https://www.nexusmods.com/transportfever3/mods/19) as a new version of its main file.
  # Runs only for full releases and only when the owner has set the secret NEXUSMODS_API_KEY and the repository variables
  # NEXUS_MOD_ID (the unique mod id, not the page number) and NEXUS_FILE_ID (the main file's id): Files tab, "Advanced". Without them the job is skipped.
  # `!cancelled()` and the explicit publish result: without them the skipped sign job made GitHub skip this job (0.2.3).
  nexus:
    needs: [build, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && !contains(needs.build.outputs.version, '-') && vars.NEXUS_FILE_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Changelog of this version
        id: notes
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Nexus shows the changelog as plain text: drop the Markdown headings (### Fixed), backticks and bold marks
          awk -v v="$VERSION" '$0 ~ "^## "v"( |$)" {f=1; next} /^## / {f=0} f' docs/CHANGELOG.md | sed -e '/^#/d' -e 's/`//g' -e 's/\*\*//g' | sed -e '/./,$!d' > changelog.txt
          { echo 'text<<EOF_CHANGELOG'; cat changelog.txt; echo 'EOF_CHANGELOG'; } >> "$GITHUB_OUTPUT"
      # pinned to v1.0.0-beta.11 by commit
      - uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ vars.NEXUS_MOD_ID }}
          file_id: ${{ vars.NEXUS_FILE_ID }}
          filename: dist/FeverLink3-${{ needs.build.outputs.version }}.zip
          display_name: FeverLink3 ${{ needs.build.outputs.version }}
          version: ${{ needs.build.outputs.version }}
          description: Copy winhttp.dll and the mods folder into the game folder (next to TransportFever3.exe). Windows, Steam. SHA-256 on the GitHub release v${{ needs.build.outputs.version }}. Updates itself (can be turned off).
          category: main
          archive_existing_version: true
          update_mod_version: true
          allow_mod_manager_download: false
          primary_mod_manager_download: false
          changelog: ${{ steps.notes.outputs.text }}
