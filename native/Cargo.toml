[package]
name = "feverlink3_native"
version = "0.1.0"
edition = "2021"
publish = false
description = "FeverLink3 native module: a winhttp.dll proxy the game loads itself; command capture and determinism patches"
license = "MIT"

[lib]
# cdylib: the DLL the game loads. rlib: the pure modules (scanner, PE parser, detour maths, build table) for tests
# and for the address-finding tool.
crate-type = ["cdylib", "rlib"]

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
