[package]
name = "feverlink3_launcher"
description = "FeverLink3 launcher: Windows platform layer (Steam discovery, game-side install, file link, game start)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
# The integration tests are ONE binary, tests/all.rs (it says why, and fails when a file in tests/ is not in it).
autotests = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "feverlink3"
path = "src/main.rs"

[[bin]]
name = "feverlink3-speedtest"
path = "src/bin/feverlink3-speedtest.rs"

[[test]]
name = "all"
path = "tests/all.rs"

[dependencies]
rand = "0.8"
feverlink3_core = { path = "../core" }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "~3.10"
